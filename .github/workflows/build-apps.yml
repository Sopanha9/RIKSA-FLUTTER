name: Build APK & IPA

# Builds a release APK and an unsigned IPA.
# The IPA is for temporary sideloading only (AltStore, Sideloadly, etc.),
# which re-sign it with your own Apple ID. It cannot go to the App Store.
#
# main uses the "production" environment, every other branch uses "staging".
# Set these variables on each environment (Settings > Environments > <name>):
#   API_BASE_URL, GOOGLE_SERVER_CLIENT_ID, GOOGLE_IOS_CLIENT_ID, GOOGLE_WEB_CLIENT_ID

on:
  workflow_dispatch:
  push:
    branches: [main, staging]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DART_DEFINES: >-
        --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
        --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }}
        --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Safe branch name for file names
        run: echo "SAFE_REF=${GITHUB_REF_NAME////-}" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} $DART_DEFINES

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk riksa-${{ env.SAFE_REF }}-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: riksa-${{ env.SAFE_REF }}-apk
          path: riksa-${{ env.SAFE_REF }}-${{ github.run_number }}.apk
          retention-days: 14

  ios:
    name: iOS IPA (unsigned, sideload)
    runs-on: macos-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DART_DEFINES: >-
        --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
        --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }}
        --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Safe branch name for file names
        run: echo "SAFE_REF=${GITHUB_REF_NAME////-}" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} $DART_DEFINES

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr riksa-${{ env.SAFE_REF }}-${{ github.run_number }}-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: riksa-${{ env.SAFE_REF }}-ipa-unsigned
          path: riksa-${{ env.SAFE_REF }}-${{ github.run_number }}-unsigned.ipa
          retention-days: 14
